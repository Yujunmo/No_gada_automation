services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: rootpass
      ORACLE_DATABASE: NOGADA
      APP_USER: testuser
      APP_USER_PASSWORD: testpass
    volumes:
      - ./init:/container-entrypoint-initdb.d:ro
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  oracle_data:
