# 테스트용 SFTP 원격 서버 (개발/검증 전용)
#
# 실제 회사 서버가 SFTP(SSH)라, table_extractor의 원격 파일 가져오기를 검증하기 위한
# 로컬 SFTP 서버다. atmoz/sftp 이미지에 유저/디렉토리만 지정하면 바로 뜬다.
#
#   기동: docker compose up -d      (127.0.0.1:2222, testuser/testpass)
#   정지: docker compose down
services:
  sftp:
    image: atmoz/sftp
    ports:
      - "2222:22"                       # 컨테이너 22 → 호스트 2222 (호스트 SSH와 충돌 방지)
    volumes:
      - ./files:/home/testuser/src      # 테스트 소스 마운트 (SFTP 유저가 src/ 안에서 추가·수정 가능)
    command: testuser:testpass:::src    # user:pass:::업로드디렉토리 → 홈 하위 src/ 로 노출
    restart: unless-stopped
