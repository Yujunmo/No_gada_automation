[project]
name = "no-gada"
version = "0.1.0"
description = "No_Gada — Oracle 업무 자동화 툴킷 (SQL Bench, Table Extractor)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlglot>=23.0",
    "paramiko>=3.0",  # 원격 소스(SFTP) 접속 — app/common/source.py
    "SQLAlchemy>=2.0",  # DB 접속 추상화(Engine/dialect) — app/common/io/db.py
    "PyMySQL>=1.1",   # 테스트 DB(MySQL) 드라이버 — SQLAlchemy dialect mysql+pymysql (반입 시 oracledb로 교체)
    "python-dotenv>=1.0",  # .env 파일 로딩 — app/main.py 기동 시 NOGADA_* env 채움
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
oracle = [
    "oracledb>=2.0",  # remote_oracle_server 리허설/반입용 — SQLAlchemy dialect oracle+oracledb
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
